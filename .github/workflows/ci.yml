name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Solo el árbol de producción: lo que de verdad se sirve en evidran.com y lo
      # que ejecutan las funciones de api/. Las herramientas de build (vite y sus
      # dependencias) quedan fuera a propósito: sus avisos no llegan al visitante,
      # y auditarlas aquí dejaría el CI en rojo permanente sin nada accionable.
      - run: npm audit --omit=dev --audit-level=high

      - run: npm run build
